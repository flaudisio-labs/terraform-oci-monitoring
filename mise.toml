[tools]
git-cliff = "2"
go = "1.27"
"pipx:bump-my-version" = "1"
prek = "latest"
shellcheck = "0.11"
terraform = "1.17"
terraform-docs = "0.25"
tflint = "0.66"

[tasks.lint]
description = "Run lint commands"
run = "prek run --all-files --color always"

[tasks.fmt]
description = "Format all Terraform files"
run = "terraform fmt -recursive ."

[tasks.test]
description = "Run tests"
run = "go test -v -count 1 -timeout ${GO_TEST_TIMEOUT-30m}"
dir = "test"

[tasks.bump-version]
description = "Bump the project version"
run = "bump-my-version bump --new-version $( git-cliff --bump --bumped-version --output - )"

[tasks.git-push]
description = "Push the current branch and related tags"
run = "git push --follow-tags origin HEAD"

[tasks.update-changelog]
description = "Update the project changelog"
run = """
  #!/usr/bin/env bash
  set -eo pipefail

  git-cliff --output CHANGELOG.md

  if [[ "$1" == "--commit" ]] ; then
    git add -- CHANGELOG.md
    [[ -n "$( git diff --staged -- CHANGELOG.md )" ]] && git commit -m "docs: update changelog" || true
  fi
"""
