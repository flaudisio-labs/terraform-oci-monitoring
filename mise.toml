[tools]
go = "1.27"
"pipx:bump2version" = "1"
prek = "latest"
shellcheck = "0.11"
terraform = "1.3"
terraform-docs = "0.25"
tflint = "0.66"

[tasks.lint]
description = "Run lint commands"
run = "prek run --all-files --color always"

[tasks.fmt]
description = "Format all Terraform files"
run = "terraform fmt -recursive ."

[tasks.test]
description = "Run tests"
run = "go test -v -count 1 -timeout ${GO_TEST_TIMEOUT-30m}"
dir = "test"

[tasks."bump-version:major"]
description = "Increment the major version (X.y.z)"
run = "bump2version major"

[tasks."bump-version:minor"]
description = "Increment the minor version (x.Y.z)"
run = "bump2version minor"

[tasks."bump-version:patch"]
description = "Increment the patch version (x.y.Z)"
run = "bump2version patch"

[tasks.release]
description = "Push the new project version"
run = "git push --follow-tags origin main"
